<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>KoalaExtract - Data Preview</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            padding: 0;
            background: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header-bar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-area {
            flex: 1;
            overflow: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .table-container {
            flex: 1;
            overflow: auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            backdrop-filter: blur(5px);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="header-bar">
        <h1><span>🐨</span> Data Preview</h1>
        <div class="flex-row">
            <span class="stat-label" style="align-self:center; margin-right: 16px;">Total Rows: <strong id="total-rows"
                    style="color:var(--text-main); font-size:14px;">0</strong></span>
            <button id="export-csv" class="btn btn-primary">CSV</button>
            <button id="export-json" class="btn btn-primary">JSON</button>
            <button id="export-xls" class="btn btn-primary">Excel</button>
        </div>
    </div>

    <div class="content-area">
        <div class="table-container">
            <table id="preview-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
            <div id="empty-state" class="empty-state">No data collected yet.</div>
        </div>
    </div>

    <script src="preview.js"></script>
</body>

</html>
