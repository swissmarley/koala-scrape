<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KoalaScrape · Data</title>
  <link rel="icon" href="../../icons/icon16.png">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><img src="../../icons/icon48.png" alt="" width="22" height="22"><span>KoalaScrape</span></div>
    <div class="meta" id="meta">No data</div>
    <div class="spacer"></div>
    <input type="search" id="search" placeholder="Filter rows…" aria-label="Filter rows">
    <button class="btn primary" data-export="xlsx">Excel</button>
    <button class="btn" data-export="csv">CSV</button>
    <button class="btn" data-export="json">JSON</button>
    <button class="btn" id="copy" title="Copy the visible rows as tab-separated values">Copy</button>
    <button class="btn danger" id="clear">Clear</button>
  </header>

  <main>
    <div class="table-wrap" id="wrap">
      <table class="data" id="table"></table>
      <div class="empty big" id="empty" hidden>No data collected yet. Open the KoalaScrape side panel on a website and run an extraction.</div>
    </div>
  </main>

  <footer class="bar foot">
    <span id="status"></span>
    <div class="spacer"></div>
    <label class="per-page">Rows per page
      <select id="per-page"><option>50</option><option selected>100</option><option>250</option><option>1000</option></select>
    </label>
    <button class="btn sm" id="first" title="First page">«</button>
    <button class="btn sm" id="prev" title="Previous page">‹</button>
    <span id="page-info" class="page-info"></span>
    <button class="btn sm" id="next" title="Next page">›</button>
    <button class="btn sm" id="last" title="Last page">»</button>
  </footer>

  <dialog class="modal" id="dialog">
    <form method="dialog">
      <h3>Clear all data?</h3>
      <p id="dialog-text"></p>
      <div class="actions">
        <button class="btn solid-danger" value="ok">Clear</button>
        <button class="btn" value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="viewer.js"></script>
</body>
</html>
